<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Ayah — Widget</title>
  <style>
    :root { --white: #f2faf5; --mint: #9fe8c2; --dim: #bcd9cb; }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      background: linear-gradient(160deg, #0f3d2e 0%, #0a2b20 100%);
      color: var(--white);
      font-family: -apple-system, system-ui, sans-serif;
      display: flex; align-items: center; justify-content: center;
      -webkit-font-smoothing: antialiased;
    }
    #card {
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center;
      padding: 5vmin; gap: 2.4vmin;
      overflow: hidden;
    }
    #head {
      font-size: calc(clamp(9px, 2.4vmin, 15px) * var(--fit, 1));
      font-weight: 600; color: var(--mint); letter-spacing: 0.04em;
    }
    #arabic {
      font-family: "Noto Naskh Arabic", "Geeza Pro", "Amiri", "Damascus", serif;
      font-size: calc(clamp(13px, 6.4vmin, 40px) * var(--fit, 1));
      line-height: 1.85;
      max-width: 94vw;
      overflow-wrap: anywhere;
    }
    #trans {
      font-size: calc(clamp(9px, 2.7vmin, 17px) * var(--fit, 1));
      line-height: 1.55; color: var(--dim);
      font-style: italic; max-width: 90vw;
      overflow-wrap: anywhere;
    }
    #foot {
      font-size: calc(clamp(8px, 1.9vmin, 12px) * var(--fit, 1));
      color: var(--dim); opacity: 0.7;
    }
    .hide { display: none !important; }
  </style>
</head>
<body>
  <div id="card">
    <div id="head">Ayah</div>
    <div id="arabic" lang="ar" dir="rtl">…</div>
    <div id="trans">Loading today's verse…</div>
    <div id="foot">daily ayah · tap to open app</div>
  </div>
  <script src="widget-page.js"></script>
</body>
</html>
